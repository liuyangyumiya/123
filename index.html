<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="高橋優希の漫画" />
    <title>高橋優希</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        background-color: #eee;
      }
      /* * {
        border: 1px solid black;
      } */
      .yinying {
        box-shadow:
          rgb(0 0 0 / 20%) 0px 1px 2px -1px,
          rgb(0 0 0 / 14%) 0px 1px 1px 0px,
          rgb(0 0 0 / 12%) 0px 1px 3px 0px;
      }
      .flex {
        display: flex;
      }
      .baise {
        background-color: white;
      }
      .flex1 {
        flex: 1;
        min-width: 0;
      }
      .column {
        flex-direction: column;
      }
      .mg8 {
        margin: 8px;
      }
      .mgr8 {
        margin-right: 8px;
      }
      .mgt8 {
        margin-top: 8px;
      }
      .line-clamp {
        overflow: hidden;
        text-overflow: ellipsis;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      .youqu {
        flex: 0 0 10px;
        min-width: 10px;
      }
      .daohang {
        padding: 10px 15px;
        border-bottom: 1px solid #ef4343;
        font-size: 18px;
        font-weight: bold;
        color: #ef435aa8;
      }
      @media (max-width: 600px) {
        .cebianlan {
          display: none;
        }
        .neirongqu {
          flex-direction: column;
        }
        .shujuqu {
          flex-direction: column;
        }
        .youqu {
          margin-left: 8px;
          flex: auto;
          min-width: 0;
        }
        .shuju {
          margin: 0 0 8px;
        }
        .flex {
          flex-direction: column;
        }
        .daohang {
          text-align: center;
        }
      }
      .neirongqu::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body class="flex">
    <!--侧边栏-->
    <div style="width: 200px; z-index: 2" class="cebianlan yinying">
      <!--头像栏-->
      <div
        style="
          padding: 10px;
          align-items: center;
          justify-content: center;
          border-bottom: 1px solid #ef4343;
        "
        class="flex"
      >
        <img
          src="https://img.remit.ee/api/file/BQACAgUAAyEGAASHRsPbAAEUcBFqEbMnmmCbNVov_c79r_4EJE9TPwACGSAAAj_wkVSRsm9k1CZADDsE.png"
          width="100"
          height="100"
          alt="头像"
        />
        <div style="margin-left: 10px">高橋優希</div>
      </div>
      <!--菜单栏-->
      <div class="daohang">导航</div>
    </div>
    <!--主内容区-->
    <div class="flex1 flex column">
      <!--头部-->
      <div style="height: 60px; z-index: 1" class="baise yinying"></div>
      <!--内容区-->
      <div style="overflow: auto" class="neirongqu flex1 flex">
        <!--左侧内容区-->
        <div style="flex: 3" class="flex column mg8">
          <!--数据区域-->
          <div class="flex shujuqu">
            <!--数据列表-->
            <div
              style="height: 100px"
              class="shuju flex1 baise yinying mgr8"
            ></div>
            <div
              style="height: 100px"
              class="shuju flex1 baise yinying mgr8"
            ></div>
            <div
              style="height: 100px"
              class="shuju flex1 baise yinying mgr8"
            ></div>
            <div style="height: 100px" class="shuju flex1 baise yinying"></div>
          </div>
          <!--列表区域-->
          <div class="flex column">
            <!--列表xiangmu-->
            <div
              style="
                height: 160px;
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 12px;
              "
              class="baise yinying mgt8"
            >
              <img
                src="https://mhfm8tel.cdndm5.com/86/85013/20250627112958_180x240_23.jpg"
                alt="クソ女に幸あれ"
                style="width: 100px; height: 100%; object-fit: cover"
              />
              <div>
                <p style="margin: 0 0 8px 0; font-weight: bold">
                  《クソ女に幸あれ》
                </p>
                <p style="margin: 0; line-height: 1.4">
                  多译名：《渣女没渣报》《让坏女孩幸福》
                </p>
                <p class="line-clamp" style="margin: 0; line-height: 1.4">
                  在中学时代时，人生中第一次被女朋友狠狠甩掉的秋吉直。曾一度认为自己「再也不会再喜欢上谁了」，但在成为大学生的当下却被电影社团的一位学姐所吸引…。然而，就在这个时候，以前把自己甩掉的女朋友再次出现在眼前…！？身份交换×错综复杂的恋爱喜剧就此展开！！
                </p>
                <a
                  href="https://www.manhuaren.com/manhua-zhanvmeizhabao/"
                  target="_blank"
                  style="
                    color: #ef435aa8;
                    display: flex;
                    justify-content: center;
                  "
                  >相关链接</a
                >
              </div>
            </div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
            <div style="height: 160px" class="baise yinying mgt8"></div>
          </div>
        </div>
        <!--右侧内容区-->
        <div style="flex: 1" class="youqu flex column mgr8 mgt8">
          <!--提示区域-->
          <div style="height: 150px" class="baise yinying"></div>
          <!--消息区域-->
          <div style="height: 300px" class="baise yinying mgt8"></div>
        </div>
      </div>
    </div>
  </body>
</html>
